<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zagazig 1937 vs Today</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body,#map{height:100%;margin:0}
  #ui{position:absolute;z-index:1000;top:10px;left:50px;right:60px;background:#fffe;padding:8px 12px;border-radius:6px;font:13px system-ui;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  #ui label{display:flex;gap:6px;align-items:center}
  #swipe{position:absolute;z-index:999;top:0;bottom:0;width:4px;margin-left:-2px;background:#c33;cursor:ew-resize;display:none}
  #swipe::after{content:"⇔";position:absolute;top:50%;left:-12px;width:28px;height:28px;line-height:28px;text-align:center;background:#c33;color:#fff;border-radius:50%}
  .gl{display:block;margin:4px 0;font:14px system-ui}
</style>
</head>
<body>
<div id="map"></div>
<div id="swipe"></div>
<div id="ui">
  <b>Zagazig 1937 ↔ today</b>
  <label>Mode <select id="mode"><option value="fade">Fade</option><option value="swipe">Swipe</option></select></label>
  <label id="fadeBox">1937 opacity <input id="op" type="range" min="0" max="1" step="0.01" value="0.6"></label>
  <label><input id="mul" type="checkbox"> multiply</label>
  <span>Click the map for Google Maps links</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const map = L.map('map',{minZoom:12,maxZoom:21}).setView([30.5877,31.5025],15);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19,attribution:'Esri World Imagery'});
L.control.layers({'Modern street map':osm,'Modern satellite':sat}).addTo(map);
// 1937 tiles: native z13-18, built by build_tiles.py from the full-resolution scan
const old = L.tileLayer('tiles/{z}/{x}/{y}.webp',{minNativeZoom:13,maxNativeZoom:18,maxZoom:21,opacity:0.6,zIndex:10,
  attribution:'Survey of Egypt 1937 (public domain, via UWM/Wikimedia Commons)',errorTileUrl:'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}).addTo(map);

const bar=$('swipe'); let swipeX=innerWidth/2;
function clip(){ const el=old.getContainer(); if(!el) return;
  if($('mode').value!=='swipe'){ el.style.clipPath=''; return; }
  const x=swipeX-el.getBoundingClientRect().left, B=1e5;   // container has zero size: polygon in its local px
  el.style.clipPath=`polygon(${x}px ${-B}px,${B}px ${-B}px,${B}px ${B}px,${x}px ${B}px)`; }
function show(){ const sw=$('mode').value==='swipe';
  bar.style.display=sw?'block':'none'; bar.style.left=swipeX+'px'; $('fadeBox').style.display=sw?'none':'';
  old.setOpacity(sw?1:+$('op').value); old.getContainer().style.mixBlendMode=$('mul').checked?'multiply':''; clip(); }
$('mode').onchange=$('op').oninput=$('mul').onchange=show;
map.on('move zoom viewreset',clip);
bar.onpointerdown=e=>{ bar.setPointerCapture(e.pointerId);
  bar.onpointermove=m=>{ swipeX=m.clientX; bar.style.left=swipeX+'px'; clip(); }; bar.onpointerup=()=>bar.onpointermove=null; };
map.on('click',e=>{
  const {lat,lng}=e.latlng, q=lat.toFixed(6)+','+lng.toFixed(6);
  L.popup().setLatLng(e.latlng).setContent(
    `<b>${q}</b><a class="gl" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${q}">Open in Google Maps (places, reviews)</a>`+
    `<a class="gl" target="_blank" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${q}">Street View here</a>`+
    `<a class="gl" target="_blank" href="https://www.google.com/maps/search/restaurants/@${q},18z">Places nearby</a>`).openOn(map); });
show();
</script>
</body>
</html>
